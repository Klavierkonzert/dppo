defaults:
  - _self_
hydra:
  run:
    dir: ${logdir}
_target_: agent.finetune.train_sac_agent.TrainSACAgent

# Pure online SAC from random init: no pretrained policy and no offline demo
# data. Reward (the kitchen task-completion bonus, restricted via DPPO_KITCHEN_TASKS)
# is the *only* signal shaping behavior, so the policy can only learn the tasks
# you select. Sparse rewards make exploration hard from scratch -- pair with
# reward shaping if it stalls.
name: ${env_name}_sac_mlp_ta${horizon_steps}
logdir: ${oc.env:DPPO_LOG_DIR}/gym-finetune/${name}/${now:%Y-%m-%d}_${now:%H-%M-%S}_${seed}
normalization_path: ${oc.env:DPPO_DATA_DIR}/gym/${env_name}/normalization.npz

seed: 42
device: cuda:0
env_name: kitchen-complete-v0
obs_dim: 60
action_dim: 9
cond_steps: 1
horizon_steps: 1
act_steps: 1

env:
  n_envs: 10
  name: ${env_name}
  max_episode_steps: 280
  reset_at_iteration: False
  save_video: False
  best_reward_threshold_for_success: 4
  wrappers:
    # Innermost wrapper (wraps the raw d4rl env before normalization): adds a
    # dense -||joint - goal|| reward toward the selected --tasks appliances so
    # from-scratch RL gets a signal instead of the all-zero sparse reward.
    # task_elements: null -> read DPPO_KITCHEN_TASKS (set by run_scratch.py).
    kitchen_dense_reward:
      task_elements: null
      dense_reward_scale: 1.0
      # Cartesian -||end_effector - appliance_site|| term. The object-distance
      # term alone gives no gradient until the arm already touches the
      # appliance, so from-scratch exploration stalls; this pulls the arm to the
      # appliance first. 0.0 disables it.
      reach_reward_scale: 1.0
      potential_based: False
      gamma: ${train.gamma}
    mujoco_locomotion_lowdim:
      normalization_path: ${normalization_path}
      # Clip the normalized obs: ~38 kitchen obs dims are near-constant in the
      # demo data (range ~0), so OOD states reached by from-scratch exploration
      # otherwise normalize to ~1e6 and blow up the policy input. In-distribution
      # values lie within ~[-1, 1], so this only bounds OOD blow-ups.
      clip_obs: 10.0
    multi_step:
      n_obs_steps: ${cond_steps}
      n_action_steps: ${act_steps}
      max_episode_steps: ${env.max_episode_steps}
      reset_within_step: True

wandb:
  entity: ${oc.env:DPPO_WANDB_ENTITY}
  project: sac-gym-${env_name}
  run: ${now:%H-%M-%S}_${name}

train:
  n_train_itr: 1000000
  n_steps: 1
  gamma: 0.99
  actor_lr: 3e-4
  critic_lr: 1e-3
  save_model_freq: 100000
  val_freq: 10000
  render:
    freq: 1
    num: 0
  log_freq: 200
  # SAC specific
  batch_size: 256
  target_ema_rate: 0.005
  scale_reward_factor: 1
  critic_replay_ratio: 256
  actor_replay_ratio: 128
  buffer_size: 1000000
  n_eval_episode: 10
  n_explore_steps: 5000
  target_entropy: ${eval:'- ${action_dim} * ${act_steps}'}
  init_temperature: 1
  # --- Stability: prevent the entropy-temperature / value runaway that
  # otherwise overflows the loss and crashes from-scratch SAC on sparse reward.
  grad_clip_norm: 1.0   # clip global grad-norm (actor/critic/alpha); null disables
  alpha_lr: 1e-4        # dedicated, lower lr for the entropy temperature
  max_alpha: 10.0       # cap on entropy temperature to break the feedback loop

model:
  _target_: model.rl.gaussian_sac.SAC_Gaussian
  randn_clip_value: 10
  tanh_output: True # squash after sampling
  actor:
    _target_: model.common.mlp_gaussian.Gaussian_MLP
    mlp_dims: [256, 256, 256]
    activation_type: ReLU
    tanh_output: False  # squash after sampling instead
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    horizon_steps: ${horizon_steps}
    action_dim: ${action_dim}
    std_max: 7.3891
    std_min: 0.0067
  critic:
    _target_: model.common.critic.CriticObsAct
    mlp_dims: [256, 256, 256]
    activation_type: ReLU
    use_layernorm: True
    cond_dim: ${eval:'${obs_dim} * ${cond_steps}'}
    action_dim: ${action_dim}
    action_steps: ${act_steps}
  horizon_steps: ${horizon_steps}
  device: ${device}
